name: CI

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Privacy Guard & Test (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Privacy and credential leak guard
        run: |
          $trackedLocal = git ls-files '.local/*'
          if ($trackedLocal) {
            throw "Tracked files found under .local/: $trackedLocal"
          }
          $leaks = git grep -n -I -E "(C:[/\\\\]Users|E:[/\\\\]test|E:[/\\\\]projects|D:[/\\\\]|/Users/|/home/|sk-ant-[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9]{16,}|AIza[0-9A-Za-z_-]{20,}|ghp_[A-Za-z0-9]{16,}|nfp_[A-Za-z0-9]{16,})" -- ':!.github/workflows/ci.yml'
          if ($LASTEXITCODE -eq 0 -and $leaks) {
            Write-Error "Potential local path or secret leak detected:`n$leaks"
            exit 1
          }
          if ($LASTEXITCODE -gt 1) {
            throw "git grep failed with exit code $LASTEXITCODE"
          }
          Write-Host "Privacy guard passed: 0 leaks in tracked files."
          $global:LASTEXITCODE = 0
          exit 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet packages (locked mode)
        run: dotnet restore --locked-mode

      - name: Build solution (Release, warnings as errors)
        run: dotnet build -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run xUnit test suite
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Package Windows x64 release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: powershell -ExecutionPolicy Bypass -File scripts/Publish-Windows.ps1

      - name: Upload Windows x64 release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Locara-windows-x64
          path: |
            artifacts/release/*/Locara-windows-x64.zip
            artifacts/release/*/Locara-windows-x64.zip.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows x64 release artifact
        uses: actions/download-artifact@v4
        with:
          name: Locara-windows-x64
          path: release-artifacts

      - name: Verify release archive and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zip_files < <(find release-artifacts -type f -name 'Locara-windows-x64.zip')
          mapfile -t sha_files < <(find release-artifacts -type f -name 'Locara-windows-x64.zip.sha256')
          if [ "${#zip_files[@]}" -ne 1 ] || [ "${#sha_files[@]}" -ne 1 ]; then
            echo "Expected exactly one zip and one sha256 file in artifact." >&2
            exit 1
          fi
          mkdir -p dist
          cp "${zip_files[0]}" dist/Locara-windows-x64.zip
          cp "${sha_files[0]}" dist/Locara-windows-x64.zip.sha256
          (cd dist && tr -d '\r' < Locara-windows-x64.zip.sha256 | sha256sum -c -)
          sha_line="$(tr -d '\r\n' < dist/Locara-windows-x64.zip.sha256)"
          if [[ ! "$sha_line" =~ ^[0-9a-f]{64}\ \ Locara-windows-x64\.zip$ ]]; then
            echo "Unexpected SHA-256 file format: $sha_line" >&2
            exit 1
          fi
          echo "SHA256_LINE=${sha_line}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/Locara-windows-x64.zip \
              dist/Locara-windows-x64.zip.sha256 \
              --clobber
          else
            read -r -d '' notes_template <<'EOF' || true
          <div dir="rtl">

          # Locara __TAG__

          إصدار جاهز للتشغيل من Locara لنظام Windows x64.

          ### التشغيل
          1. نزّل ملف `Locara-windows-x64.zip` وفك الضغط في أي مجلد.
          2. شغّل `Locara.Desktop.exe` مباشرة (لا يحتاج تثبيت .NET).

          ### التحقق من الملف (SHA-256)

          </div>

          ```text
          __SHA256__
          ```

          ---

          **English:** Standalone Windows x64 release of Locara `__TAG__` (includes `Locara.Desktop.exe`, licenses, and the Windows usage guide).
          EOF
            notes="${notes_template//__TAG__/$tag}"
            notes="${notes//__SHA256__/$SHA256_LINE}"
            printf '%s\n' "$notes" > release-notes.md
            extra_args=()
            if [[ "$tag" == *-* ]]; then
              extra_args+=(--prerelease)
            fi
            gh release create "$tag" \
              dist/Locara-windows-x64.zip \
              dist/Locara-windows-x64.zip.sha256 \
              --title "Locara ${tag}" \
              --notes-file release-notes.md \
              --generate-notes \
              --verify-tag \
              "${extra_args[@]}"
          fi
